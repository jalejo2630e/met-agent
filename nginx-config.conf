# Referencia de Nginx (la config real del contenedor está en docker/nginx/default.conf).
# El webhook post-call de ElevenLabs envía el audio (base64) en un POST aparte de
# varios MB; el límite debe ser alto o nginx lo rechaza con 413 y el audio no se guarda.

# Tamaño máximo del cuerpo de la petición.
client_max_body_size 100M;

# También es recomendable aumentar los timeouts para archivos grandes
client_body_timeout 60s;
client_header_timeout 60s;

# Configuración para FastCGI (si usas PHP-FPM)
fastcgi_read_timeout 300;
fastcgi_send_timeout 300;

