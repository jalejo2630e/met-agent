# Configuración de Nginx para permitir carga de archivos de hasta 2MB
# Este archivo debe ser incluido en la configuración de nginx del servidor

# Aumentar el tamaño máximo del cuerpo de la petición a 2MB (o más si es necesario)
client_max_body_size 2M;

# También es recomendable aumentar los timeouts para archivos grandes
client_body_timeout 60s;
client_header_timeout 60s;

# Configuración para FastCGI (si usas PHP-FPM)
fastcgi_read_timeout 300;
fastcgi_send_timeout 300;

